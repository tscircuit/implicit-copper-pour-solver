# Created using @tscircuit/plop
name: Bun Test

on:
  pull_request:
  push:
    branches: [main, "!version-bumps/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun test
      - name: Upload SVG snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: svg-snapshot-artifacts
          path: |
            **/*.diff.png
            **/*.snap.svg
